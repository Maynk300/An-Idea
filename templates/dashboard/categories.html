{% extends 'base.html' %}

{% block content %}
<div class="row">

    <!-- Left Side -->
    <div class="col-md-3">

        <div class="nav flex-column nav-pills bg-light" aria-orientation="vertical">
            <a href="{% url 'dashboard' %}" class="nav-link text-dark {% if request.resolver_match.url_name == 'dashboard' %}bg-warning{% endif %}">Dashboard</a>
            <a href="{% url 'categories' %}" class="nav-link text-dark {% if request.resolver_match.url_name == 'categories' %}bg-warning{% endif %}">Category</a>
            <a href="{% url 'my_blogs' %}" class="nav-link text-dark {% if request.resolver_match.url_name == 'my_blogs' %}bg-warning{% endif %}">My Blogs</a>
            <a href="" class="nav-link text-dark ">Layout</a>


        </div>
    </div>

    <!-- Right Side -->

    <div class="col-md-9">
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">{{category_count}}</h5>
                    </div>
                    

                </div>

            </div>
             <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Posts</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">{{blog_count}}</h5>
                    </div>
                    

                </div>

            </div>
        </div>
    </div>

</div>
{% endblock %}
